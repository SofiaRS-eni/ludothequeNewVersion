spring:
  config:
    import: optional:file:env.properties
  application:
    name: ludotheque

  datasource:
    url: jdbc:sqlserver://localhost;databasename=LUDO_DB;encrypt=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create


